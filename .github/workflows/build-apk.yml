name: Build AlShihab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q AlShihab-Stage4-Final.zip -d project

          echo "=== Searching for Android project ==="
          find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

          ROOT=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Gradle project was not found."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android project root: $ROOT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: ${{ env.ROOT }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlShihab-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
