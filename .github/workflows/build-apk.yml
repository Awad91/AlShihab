nameBuild AlShihab APK

on:
  workflow_dispatch:  
  push:
    branches:
   - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
    uses: actions/checkout@v4

     - name: Set up Java 17
     uses: actions/setup-java@v4
     with:distribution: temurin
    java-version: '17'

    -name: Set up Android SDK
    uses: android-actions/setup-android@v4

    -name: Extract Android project
     shell: bash
      run: |
     set -e

    rm -rf project
     mkdir -p project

     unzip -q AlShihab-Stage4-Final.zip -d project

     ROOT="$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

    if [ -z "$ROOT" ]; then
        echo "ERROR: settings.gradle or settings.gradle.kts was not found."
     find project -maxdepth 6 -type f | sort
     exit 1
    fi

     ROOT="$(dirname "$ROOT")"

      echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      echo "Android project root: $ROOT"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
      gradle-version: '8.10.2'

  - name: Build debug APK
    shell: bash
    working-directory: ${{ env.ROOT }}
        run: |
     set -e
    gradle assembleDebug --stacktrace

    - name: Upload debug APK
     uses: actions/upload-artifact@v4
     with:
     name: AlShihab-APK
     path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
     if-no-files-found: error
